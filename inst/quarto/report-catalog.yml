schema_version: 1
reports:
  - id: edu_legacy_v1
    file: facs_edu_pseudocolor_output_contract.qmd
    status: stable_compatibility
    package_line: 0.1.x
    description: Established EdU experiment report retained at its original filename for old render commands.
  - id: edu_standard_v2
    file: facs_edu_standard_v2.qmd
    status: current_development
    package_line: 0.2.x
    description: Enhanced EdU report with interactive reference lines, gate boxes, plot cards, gating diagnostics, and PDF downloads.
  - id: cdc45_standard_v1
    file: facs_cdc45_standard_v1.qmd
    status: current_development
    package_line: 0.2.x
    description: CDC45 experiment report, identical to edu_standard_v2 except all reader-facing text and titles refer to CDC45 rather than EdU. Runs through the same edu-mode pipeline (plot_type edu, target_display_mode poi_cdc45).
  - id: ph3_standard_v1
    file: facs_ph3_standard_v1.qmd
    status: current_development
    package_line: 0.2.x
    description: pH3 experiment report matching the EdU/CDC45 Standard style -- pseudocolor cards with a toggleable pH3+ gate overlay, Single Cells DNA-A/DNA-H gating cards, DNA normalization (raw vs G1-anchored) cards, and PDF downloads. For plot_type ph3 legacy-tier analyses (ph3_input_profile legacy_count_only_unverified_v1); does not require the full production_direct_identity_v1 contract.
  - id: poi_standard_v1
    file: facs_poi_standard_v1.qmd
    status: current_development
    package_line: 0.2.x
    description: POI experiment report matching the EdU/CDC45/pH3 Standard style -- pseudocolor cards, Single Cells DNA-A/DNA-H gating cards, raw-vs-background-corrected signal cards, and PDF downloads. No gate-overlay toggle (POI has no gate box). Intentionally omits phase/gate composition-percentage quantitation (documented denominator/y-limit inconsistency, unresolved) and hides the background_quantile cutoff line when it would be unit-mismatched with the configured pseudocolor_signal (see show_cutoff_line).
  - id: edu_model_gated_experimental
    file: facs_edu_model_gated.qmd
    status: experimental
    package_line: 0.2.x
    description: Compact report supporting the separately validated single_g1_edu_frozen_v1 and documented_edu_g1_v1 experimental model-gating profiles.
  - id: edu_configurator_experimental
    file: facs_configurator.qmd
    status: unfinished
    package_line: 0.2.x
    description: Unfinished guided configuration interface; not part of the stable report workflow.
